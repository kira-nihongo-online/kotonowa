<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Kotonowa</title>

<style>

html,body{
  height:100%;
  margin:0;
}

body{
  font-family:sans-serif;
  padding:10px;
  display:flex;
  flex-direction:column;
  box-sizing:border-box;
}

h2{
  margin-top:15px;
  font-size:16px;
  border-bottom:1px solid #ccc;
  padding-bottom:4px;
}

textarea{
  width:100%;
  height:36vh;
  margin-top:10px;
  padding:14px;
  box-sizing:border-box;
  resize:none;
  font-size:100px;
  line-height:1.5;
}

button{
  margin-top:5px;
  padding:6px;
  width:100%;
  cursor:pointer;
}

.langButtons{
  display:flex;
  gap:8px;
  margin-top:10px;
  margin-bottom:10px;
}

.langButtons button,
.buttons button{
  flex:1;
  height:50px;
  font-size:28px;
  font-weight:bold;
  background:#f5f5f5;
  border:1px solid #ccc;
  border-radius:8px;
  cursor:pointer;
}

.langButtons button.active{
  background:#d32f2f;
  color:white;
  border-color:#d32f2f;
}

.buttons{
  display:flex;
  gap:8px;
  margin-top:18px;
  margin-bottom:12px;
}

.result{
  background:#f5f5f5;
  border:1px solid #ccc;
  margin-top:0;
  padding:14px;
  min-height:30vh;
  font-size:100px;
  line-height:1.5;
}

/* ========================== */
/* タイ語だけ見やすく調整 */
.translated{
  font-size:1em;
  font-weight:normal;
  line-height:1.5;
}

.section{
  margin-bottom:20px;
}

.wordRow{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #ddd;
  padding:3px 0;
  cursor:pointer;
}

#micBtn.listening{
  background:#d32f2f;
  color:#fff;
  border-color:#d32f2f;
}

.inputArea{
    position:relative;
}

.copyBtn{
    position:absolute;
    right:12px;
    bottom:12px;
    font-size:40px;
    cursor:pointer;
}

#startScreen{
  position:fixed;
  inset:0;
  background-image:url("student-background.png");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  z-index:9999;
}

</style>

</head>

<body>

<div id="startScreen">

  <img src="トータルロゴ2.png" alt="Kotonowa" style="width:180px; position:absolute; top:15%; left:50%; transform:translate(-50%,-50%);">

  <div style="position:absolute; top:23%; left:50%; transform:translateX(-50%); text-align:center; font-weight:bold; white-space:nowrap;">
    <div style="font-size:80px; color:#ffffff;">Kotonowa</div>
    <div style="font-size:60px; color:#00bfff;">Teacher</div>
  </div>

  <div style="position:absolute; top:35%; left:50%; transform:translateX(-50%); text-align:center; font-size:24px; color:#ffffff; white-space:nowrap;">
    Connect ・ Communicate ・ Learn
  </div>

  <div style="position:absolute; top:40%; left:17.5%; text-align:left; white-space:nowrap;">
    <div style="font-size:32px; font-weight:bold; color:#ffffff;">Student Number</div>
  </div>

  <div style="position:absolute; top:43%; left:50%; transform:translateX(-50%); width:85%; max-width:700px; height:120px;">

    <div style="position:relative; width:100%; height:100%;">

      <input
        id="studentNumberInput"
        type="text"
        inputmode="numeric"
        maxlength="4"
        style="width:100%; height:100%; box-sizing:border-box; text-align:center; font-size:72px; letter-spacing:50px; border:3px solid #2196f3; border-radius:18px; padding-right:70px; background:rgba(255,255,255,0.08); color:transparent;"
      >

      <div
        id="studentNumberMask"
        style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding-right:70px; padding-top:20px; box-sizing:border-box; font-size:72px; letter-spacing:20px; color:#ffffff; pointer-events:none;"
      ></div>

      <div onclick="toggleStudentNumber()" style="position:absolute; right:22px; top:50%; transform:translateY(-50%); width:64px; height:44px; cursor:pointer;">
        <svg viewBox="0 0 64 40" width="64" height="44">
          <path
            d="M4 20
               C12 7, 22 2, 32 2
               C42 2, 52 7, 60 20
               C52 33, 42 38, 32 38
               C22 38, 12 33, 4 20 Z"
            fill="none"
            stroke="#ffffff"
            stroke-width="4"
            stroke-linejoin="round"
          />
          <circle
            cx="32"
            cy="20"
            r="9"
            fill="none"
            stroke="#ffffff"
            stroke-width="4"
          />
          <circle
            cx="32"
            cy="20"
            r="4"
            fill="#ffffff"
          />
        </svg>
      </div>

    </div>

    <div style="text-align:center; margin-top:18px; font-size:24px; color:#ffffff;">
      Enter your 4-digit number
    </div>

    <button
      style="
        position:absolute;
        top:200%;
        left:50%;
        transform:translateX(-50%);
        width:100%;
        max-width:700px;
        height:120px;
        box-sizing:border-box;
        margin:0;
        padding:0;
        font-size:48px;
        font-weight:bold;
        border:3px solid #2196f3;
        border-radius:18px;
        background:linear-gradient(90deg,#1976d2,#2196f3);
        color:#ffffff;
        cursor:pointer;
      "
    >
      🔗 Connect
    </button>

    <div
      style="
        position:absolute;
        top:400%;
        left:50%;
        transform:translateX(-50%);
        width:100%;
        max-width:700px;
        display:flex;
        align-items:center;
        gap:32px;
        color:#ffffff;
        font-size:28px;
        text-align:center;
      "
    >
      <div style="flex:1; height:2px; background:#ffffff;"></div>
      <span>or</span>
      <div style="flex:1; height:2px; background:#ffffff;"></div>
    </div>

    <button
      id="translationOnlyBtn"
      style="
        position:absolute;
        top:500%;
        left:50%;
        transform:translateX(-50%);
        width:100%;
        max-width:700px;
        height:120px;
        box-sizing:border-box;
        margin:0;
        padding:0;
        font-size:48px;
        font-weight:bold;
        border:3px solid #2196f3;
        border-radius:18px;
        background:rgba(30,70,120,0.65);
        color:#ffffff;
        cursor:pointer;
      "
    >
      🌐 Translation Only
    </button>

    <div
      style="
        position:absolute;
        top:700%;
        left:50%;
        transform:translateX(-50%);
        text-align:center;
        font-size:24px;
        color:#ffffff;
        white-space:nowrap;
      "
    >
      Words Make a New World
    </div>

    <div
      style="
        position:absolute;
        top:900px;
        left:50%;
        transform:translateX(-50%);
        width:90px;
        height:2px;
        background:#ffffff;
      "
    ></div>

  </div>

</div>

<!-- ===== 授業翻訳 ===== -->

<!-- ===== ロゴ ===== -->
<div style="display:flex; align-items:center; justify-content:center; gap:12px; margin:35px 0 25px 0;">
  <img src="トータルロゴ.png" alt="Kotonowa" style="width:48px; height:48px;">
  <h1 style="margin:0; font-size:40px; font-weight:bold;">Kotonowa</h1>
</div>

<div class="topArea">
</div>

<div>入力</div>

<div class="langButtons">
  <button id="inputJpBtn">JP</button>
  <button id="inputThBtn">TH</button>
  <button id="inputEnBtn">EN</button>
</div>

<div>翻訳</div>

<div class="langButtons">
  <button id="jpBtn">JP</button>
  <button id="thBtn" class="active">TH</button>
  <button id="enBtn">EN</button>
</div>

<div class="inputArea">

<textarea id="jpInput" placeholder="入力してください"></textarea>

<span class="copyBtn" id="copyInputBtn">📋</span>

</div>

<div class="buttons">
  <button id="micBtn">🎤</button>
  <button id="translateBtn">🌐</button>
  <button id="clearBtn">🗑️</button>
  <button id="speakBtn">🔊</button>
</div>

<div class="inputArea">

  <div class="result" id="translateResult"></div>

  <span class="copyBtn" id="copyResultBtn">📋</span>

</div>

<script src="panel.js"></script>

</body>
</html>
